{% extends "base.html" %}{% block title %}Student Registration{% endblock %}
{% block content %}<section class="panel" style="max-width:520px;margin:35px auto">
<h1>Student Registration</h1><p class="muted">Create a student account to browse gadgets and request a loan.</p>
<form method="post">
<label>Full name</label><input name="name" required maxlength="100" placeholder="Enter your full name">
<label>Email address</label><input type="email" name="email" required placeholder="student@example.com">
<label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required>
<button type="submit">Register</button>
</form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
